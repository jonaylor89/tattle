name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cross --locked
      # Static musl binaries: one file, runs on any distro.
      - run: cross build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/tattle tattle-${{ matrix.arch }}-linux
          sha256sum tattle-${{ matrix.arch }}-linux > tattle-${{ matrix.arch }}-linux.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tattle-${{ matrix.arch }}-linux
            tattle-${{ matrix.arch }}-linux.sha256
