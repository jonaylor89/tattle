[package]
name = "tattle"
version = "0.1.4"
edition = "2024"
description = "Application firewall in the spirit of Little Snitch, with an Omarchy shell plugin"
license = "MIT"
repository = "https://github.com/jonaylor89/tattle"
readme = "README.md"
keywords = ["firewall", "nftables", "omarchy", "privacy", "network"]
categories = ["command-line-utilities", "network-programming"]
# Not part of the crate: CI rewrites these after each release (pinned hashes,
# plugin/package version), and that must not count as a change to release.
exclude = ["manifest.json", "packaging/arch/PKGBUILD", "packaging/checksums/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
crossterm = "0.29.0"
flate2 = "1.1.11"
libc = "0.2.191"
maxminddb = { version = "0.33.0", features = ["mmap"] }
nfq = "0.2.6"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
